name: Probe official publishing endpoints

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Fixed endpoint diagnostic mode'
        type: choice
        options: [standard, normal-browser]
        default: standard

permissions:
  contents: read

concurrency:
  group: official-source-discovery-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'BD4L/breach-dashboard-v2' && github.ref == 'refs/heads/main' && inputs.mode != 'normal-browser'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 26
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - name: Install ordinary Chromium for six browser probes
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Compare fixed official HTTP endpoints
        if: runner.os != 'Linux'
        run: python scripts/discovery_probe.py --output artifacts/discovery-probe.json
      - name: Compare fixed official HTTP and browser endpoints
        if: runner.os == 'Linux'
        run: python scripts/discovery_probe.py --browsers --output artifacts/discovery-probe.json
      - name: Keep diagnostic metadata for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: discovery-probe-${{ matrix.os }}
          path: artifacts/discovery-probe.json
          if-no-files-found: warn
          retention-days: 1

  normal-browser:
    if: github.repository == 'BD4L/breach-dashboard-v2' && github.ref == 'refs/heads/main' && inputs.mode == 'normal-browser'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.lock playwright==1.62.0
      - name: Prepare Chrome dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Inspect normal Chrome on Linux with its virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/discovery_probe.py --normal-browser-only --output artifacts/normal-browser.json
      - name: Inspect normal Chrome on macOS
        if: runner.os == 'macOS'
        run: python scripts/discovery_probe.py --normal-browser-only --output artifacts/normal-browser.json
      - name: Keep diagnostic metadata for one day
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: normal-browser-${{ matrix.os }}
          path: artifacts/normal-browser.json
          retention-days: 1
